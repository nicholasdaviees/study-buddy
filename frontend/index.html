<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Study Buddy</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Study Buddy</h1>

        <nav aria-label="Main navigation">
            <a href="studybuddy2.html">Home</a>
            <a href="#flashcards">Flashcards</a>
            <a href="#quizzes">Practice Quiz</a>
            <a href="#saved">Saved Materials</a>
        </nav>
    </header>

    <main class="dashboard">
        <h2>Welcome Back!</h2>
        <p>
            Upload your course material and generate
            flashcards, quizzes, and study resources.
        </p>

        <section class="upload-section">
            <h3>Upload a PDF</h3>

            <label for="pdf-upload">
                Select your study material:
            </label>

            <input
                type="file"
                id="pdf-upload"
                accept=".pdf,application/pdf"
            >

            <p id="file-status" role="status">
                No file selected.
            </p>
        </section>

        <section class="study-tools">
            <h3>Study Tools</h3>

            <div class="tool-grid">
                <button id="flashcard-btn">
                    Generate Flashcards
                </button>

                <button id="quiz-btn">
                    Generate Practice Quiz
                </button>

                <button id="truefalse-btn">
                    Generate True/False Quiz
                </button>

                <button id="ask-btn">
                    Ask Study Buddy
                </button>
            </div>
        </section>
    </main>
</body>
</html>
